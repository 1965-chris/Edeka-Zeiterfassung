<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zeiterfassung</title>
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeiten">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --text:#17201d; --muted:#6b7773; --line:#e2e7e5;
  --accent:#1f6f5c; --accent-soft:#dcefe8; --plus:#1f8a4c; --minus:#c0392b;
  --urlaub:#2f7bd8; --feiertag:#8e44ad; --krank:#d35400; --frei:#8a9490; --sonder:#b8860b; --abbau:#16a085;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1413; --card:#1a2220; --text:#e8eeec; --muted:#93a19c; --line:#2a3532;
    --accent:#4fbf9f; --accent-soft:#1d3a32; --plus:#4cd07d; --minus:#ff6b5b;
    --urlaub:#5aa2ff; --feiertag:#c084fc; --krank:#ff9a4d; --frei:#7d8a86; --sonder:#e0b83a; --abbau:#3dd6b5;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:0 0 calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
header h1{margin:0;font-size:22px;letter-spacing:-.3px}
header .sub{color:var(--muted);font-size:13px}
main{padding:0 16px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:17px}
.nav small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.iconbtn{border:0;background:var(--accent-soft);color:var(--accent);width:40px;height:40px;border-radius:12px;font-size:20px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border-radius:12px;padding:10px 8px;text-align:center}
.stat .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.pos{color:var(--plus)} .neg{color:var(--minus)}
.day{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.day:last-child{border-bottom:0}
.day .d{width:52px;flex:none}
.day .d b{display:block;font-size:15px}
.day .d span{font-size:12px;color:var(--muted)}
.day .m{flex:1;min-width:0}
.day .m .t{font-variant-numeric:tabular-nums;white-space:nowrap}
.day .m .t .muted{font-size:12px}
.day .m .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .h{font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.day.today .d b{color:var(--accent)}
.day.sun{opacity:.75}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff;background:var(--accent)}
.chip.urlaub{background:var(--urlaub)} .chip.feiertag{background:var(--feiertag)} .chip.krank{background:var(--krank)}
.chip.frei{background:var(--frei)} .chip.sonder{background:var(--sonder)} .chip.abbau{background:var(--abbau)}
.chip.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.hol{font-size:11px;color:var(--feiertag)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:transparent;color:var(--minus)}
.btn.small{padding:7px 11px;font-size:13px}
.btn.on{background:var(--accent);color:#fff}
.btn:disabled{opacity:.45}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
input,select{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:44px}
input[type=date],input[type=time]{display:block;text-align:left;line-height:22px}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
input[type=checkbox]{width:22px;height:22px;min-height:0;-webkit-appearance:auto;appearance:auto;flex:none}
.grid2>*,.grid3>*{min-width:0}
.grid2,.grid3{align-items:end}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.hdr .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
#navbar:empty{display:none}
#navbar .card{margin:10px 0 0}
header{max-width:640px;margin:0 auto;box-shadow:0 6px 8px -8px rgba(0,0,0,.15)}
.todaybtn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;flex:none}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
tfoot td{font-weight:700;border-bottom:0}
h2{font-size:15px;margin:4px 0 8px}
.muted{color:var(--muted);font-size:13px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0 8px;font-size:11px;font-weight:600}
.tabbar button .i{display:block;font-size:20px;line-height:1.2}
.tabbar button.act{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.sheet-bg.open{display:block}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 4px;font-size:14px;font-weight:600}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.calc{margin-top:10px;padding:10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;text-align:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.tpl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px 40px;gap:6px 8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.tpl:last-of-type{border-bottom:0}
.tpl>*{min-width:0}
.tpl .name{grid-column:1/-1}
.tpl input{width:100%}
.tpl label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.tpl input{padding:8px 10px}
.tpl .btn{height:44px;padding:0}
.coll{padding:0}
.coll-h{display:flex;width:100%;align-items:center;justify-content:space-between;border:0;background:none;color:var(--text);padding:14px;font:inherit;text-align:left}
.coll-h h2{margin:0}
.coll-h .chev{color:var(--muted);font-size:20px;transition:transform .2s;line-height:1}
.coll.open .coll-h .chev{transform:rotate(90deg)}
.coll-b{display:none;padding:0 14px 14px}
.coll.open .coll-b{display:block}
.coll-h .badge{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days7 button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:6px 2px;font-size:12px;line-height:1.25;min-width:0}
.days7 button b{display:block;font-size:13px}
.days7 button span{display:block;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days7 button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.days7 button.on span{color:#fff;opacity:.85}
.kalbar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border-radius:12px;background:#fff3e0;color:#8a4b00;font-size:14px;font-weight:600}
@media (prefers-color-scheme: dark){ .kalbar{background:#3a2a12;color:#ffc77a} }
.kalbar span{flex:1}
.iconbtn.on{background:var(--accent);color:#fff}
.dash{cursor:pointer}
.dash h2{display:flex;justify-content:space-between;align-items:center}
.dash h2 span{color:var(--muted);font-weight:400;font-size:18px}
.nx{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.nx:last-child{border-bottom:0}
.nx b{min-width:72px}
.today-big{font-size:22px;font-weight:800;margin:2px 0}
.swipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.swipe::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;min-width:0;padding:0 16px;scroll-snap-align:start;scroll-snap-stop:always}
.dots{display:flex;justify-content:center;gap:7px;margin:2px 0 0}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
.cd-hero{padding:12px 14px 14px}
.rimg{margin:0 auto;max-width:340px;border-radius:12px;overflow:hidden}
.rimg svg{max-height:265px}
.cd{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:8px 0}
.cd .ic{font-size:30px;line-height:1}
.cd .tx{flex:1;min-width:0}
.cd .tx b{display:block;font-size:16px}
.cd .num{text-align:right;line-height:1}
.cd .num b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.cd .num span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.cd-hero .big{font-size:48px}
.huge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.huge-grid .stat .v{font-size:24px}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar>div{height:100%;background:var(--accent);border-radius:99px}
table.calc2 td{padding:7px 4px}
table.calc2 tr.sum td{font-weight:700;border-top:2px solid var(--line)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kalbar button{border:0;border-radius:10px;padding:7px 12px;font-weight:700;background:#e67e22;color:#fff;font-size:14px}
.kalbar button.x{background:transparent;color:inherit;padding:7px 6px}
.pop-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:calc(100% - 32px);max-width:440px;max-height:84vh;overflow:auto;background:var(--card);border-radius:18px;padding:16px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pop.open,.pop-bg.open{display:block}
.pop-h{display:flex;gap:10px;align-items:center;font-size:17px;line-height:1.25}
.pop-h .ic{font-size:30px;line-height:1}
.info{font-size:14px}
.info p{margin:6px 0}
.info ul{margin:4px 0 8px;padding-left:20px}
.info li{margin:3px 0}
.info a,.pop a{color:var(--accent);font-weight:600;text-decoration:none}
details summary{cursor:pointer;padding:6px 0}
.chk{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;margin:12px 0}
.step{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-of-type{border-bottom:0}
.step .tx{flex:1;min-width:0;cursor:pointer}
.step .tx b{display:block;font-size:15px}
.step.done .tx b{text-decoration:line-through;opacity:.55}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.tag.due{background:var(--minus);color:#fff}
.tag.ok{background:var(--plus);color:#fff}
.chg{font-style:normal;color:var(--sonder);font-size:12px;margin-left:3px}
.blk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.blk:last-child{border-bottom:0}
.blk.plan{color:var(--muted)}
.log{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.log:last-child{border-bottom:0}
.log .k{color:var(--krank);font-weight:700}
.aend{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:center;margin-top:8px}
.aend .btn{height:44px;padding:0}
.helpbtn{font-weight:800;font-size:19px}
.info ol{margin:4px 0 8px;padding-left:20px}
.info ol li{margin:4px 0}
</style>
</head>
<body>
<header class="hdr"><div class="top"><div><h1 id="title">Zeiterfassung</h1><div class="sub" id="subtitle"></div></div><div style="display:flex;gap:8px;align-items:center"><button class="todaybtn" id="todayBtn" hidden>Heute</button><button class="iconbtn" id="backBtn" aria-label="Schließen" hidden>✕</button><button class="iconbtn helpbtn" id="helpBtn" aria-label="Hilfe">?</button><button class="iconbtn" id="setBtn" aria-label="Einstellungen">⚙️</button></div></div><div id="navbar"></div><div id="kalbar"></div></header>
<main id="app"></main>

<nav class="tabbar">
  <button data-tab="start"><span class="i">🏠</span>Start</button>
  <button data-tab="woche"><span class="i">🗓️</span>Woche</button>
  <button data-tab="monat"><span class="i">📊</span>Monat</button>
  <button data-tab="jahr"><span class="i">📈</span>Jahr</button>
  <button data-tab="rente"><span class="i">🏖️</span>Rente</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="pop-bg" id="popBg"></div>
<div class="pop" id="pop"></div>

<script>
'use strict';
const APP_VERSION = 'v2.14';
const KEY = 'zeiterfassung-daten';

/* ---------- Typen ---------- */
const TYPEN = {
  arbeit:   {name:'Arbeit',     gutschrift:false},
  frei:     {name:'Frei',       gutschrift:false},
  urlaub:   {name:'Urlaub',     gutschrift:true},
  feiertag: {name:'Feiertag',   gutschrift:true},
  krank:    {name:'Krank',      gutschrift:true},
  sonder:   {name:'Sonderurl.', gutschrift:true},
  abbau:    {name:'Ü-Abbau',    gutschrift:false}
};

/* ---------- Daten ---------- */
const DEFAULT = {
  settings:{
    sollTag:6.25, wochenSoll:37.5, startDatum:'', startSaldo:0, urlaubAnspruch:0, feiertageNRW:true, backupTage:30,
    kal:{v:2, an:false, name:'Schicht löschen', sofort:false, urlaubGanz:true, modus:'app',
         typen:['arbeit','frei','abbau','urlaub','krank','feiertag'],
         ort:'EDEKA Möller, Elsa-Neumann-Straße 6, 40789 Monheim am Rhein',
         regelWort:'Baumberg', regelOrt:'EDEKA Möller, Geschwister-Scholl-Straße 69'},
    rente:{regel:'', beginn:'', frei:'', versBeginn:'', infoStand:'', infoEP:'', infoPrognose:'', infoRW:'', epExtra:'',
           rentenwert:42.52, de:{2024:47085, 2025:50493, 2026:51944}, kvZusatz:2.9, pv:3.6, anpassung:2},
    steuer:{verh:false, pName:'Partner/in', kvZ:2.9, pv:1.8},
    schichten:[
      {name:'Früh',  von:'05:45', bis:'13:45', pause:30},
      {name:'Spät',  von:'13:15', bis:'21:15', pause:30},
      {name:'Mittel',von:'10:15', bis:'18:15', pause:30}
    ]
  },
  days:{}, monate:{}
};
let S;
function load(){
  try{ S = JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ S = null; }
  if(!S) S = structuredClone(DEFAULT);
  const altKal = (S.settings||{}).kal || {};
  S.settings = Object.assign(structuredClone(DEFAULT.settings), S.settings||{});
  S.settings.kal = Object.assign(structuredClone(DEFAULT.settings.kal), altKal);
  { const k=S.settings.kal; if(k.ort==='EDEKA Möller, Geschwister-Scholl-Straße 69' && k.regelOrt==='EDEKA Möller, Elsa-Neumann-Straße 6, 40789 Monheim am Rhein'){ k.ort=DEFAULT.settings.kal.ort; k.regelOrt=DEFAULT.settings.kal.regelOrt; } }
  { const alt=(S.settings.rente)||{}; S.settings.rente=Object.assign(structuredClone(DEFAULT.settings.rente), alt); S.settings.rente.de=Object.assign({}, DEFAULT.settings.rente.de, alt.de||{}); }
  if(!altKal.v){ const k=S.settings.kal; k.v=2; k.typen=[...DEFAULT.settings.kal.typen]; delete k.urlaubAn; delete k.urlaubName; }
  S.settings.steuer = Object.assign(structuredClone(DEFAULT.settings.steuer), S.settings.steuer||{});
  S.days = S.days||{}; S.monate = S.monate||{}; S.kalQ = S.kalQ||[]; S.steuer = S.steuer||{}; S.log = S.log||[]; S.erinn = S.erinn||{}; if(!S.wcStart) S.wcStart=iso(new Date());
}
/* UI-Zustand (aufgeklappte Bereiche) – nur Komfort */
let UI={}; try{ UI=JSON.parse(localStorage.getItem('zeiterfassung-ui'))||{}; }catch(e){ UI={}; }
function uiSave(){ try{ localStorage.setItem('zeiterfassung-ui',JSON.stringify(UI)); }catch(e){} }
function sec(id,title,body,badge,offen){
  const auf = UI[id]===undefined ? !!offen : !!UI[id];
  return `<div class="card coll ${auf?'open':''}" data-sec="${id}"><button class="coll-h" data-coll="${id}"><h2>${title}${badge?`<span class="badge">${badge}</span>`:''}</h2><span class="chev">›</span></button><div class="coll-b">${body}</div></div>`;
}
/* Tag setzen/löschen, meldet ob sich etwas geändert hat */
function setDay(s,e){
  const alt=S.days[s]||null, vorher=JSON.stringify(alt);
  if(e) S.days[s]=e; else delete S.days[s];
  const ch = vorher!==JSON.stringify(e||null);
  if(ch && alt) logChange(s,alt,e||null);
  return ch;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Speichern fehlgeschlagen!'); }
}

/* ---------- Helfer ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const WT = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmt = n => (Math.round(n*100)/100).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtS = n => (n>0?'+':'') + fmt(n);
const eur = n => isFinite(n) ? n.toLocaleString('de-DE',{style:'currency',currency:'EUR'}) : '–';
const ddmm = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
const toMin = s => { if(!s) return null; const [h,m]=s.split(':').map(Number); return h*60+m; };
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n)?n:0; };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function kw(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }

/* ---------- Feiertage NRW ---------- */
const holCache = {};
function ostern(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function feiertage(y){
  if(holCache[y]) return holCache[y];
  const e=ostern(y), r={};
  const add=(d,n)=>r[iso(d)]=n;
  add(new Date(y,0,1),'Neujahr'); add(addDays(e,-2),'Karfreitag'); add(addDays(e,1),'Ostermontag');
  add(new Date(y,4,1),'Tag der Arbeit'); add(addDays(e,39),'Christi Himmelfahrt'); add(addDays(e,50),'Pfingstmontag');
  add(addDays(e,60),'Fronleichnam'); add(new Date(y,9,3),'Tag der Dt. Einheit'); add(new Date(y,10,1),'Allerheiligen');
  add(new Date(y,11,25),'1. Weihnachtstag'); add(new Date(y,11,26),'2. Weihnachtstag');
  return holCache[y]=r;
}
const zuschlagP = e => e.zuschlag===true ? 100 : (+e.zuschlag||0);
const feiertag = s => S.settings.feiertageNRW ? feiertage(+s.slice(0,4))[s] : null;

/* ---------- Berechnung ---------- */
function stunden(e){
  if(!e || e.typ==='frei') return 0;
  if(e.std!=null && e.std!=='') return num(e.std);
  if(TYPEN[e.typ]?.gutschrift) return S.settings.sollTag;
  if(e.typ!=='arbeit') return 0;
  let a=toMin(e.von), b=toMin(e.bis);
  if(a==null||b==null) return 0;
  if(b<a) b+=1440;
  return Math.max(0,(b-a-(+e.pause||0))/60) * (1 + zuschlagP(e)/100);
}
function woche(mo){
  let ist=0, hat=false;
  for(let i=0;i<7;i++){ const e=S.days[iso(addDays(mo,i))]; if(e){hat=true; ist+=stunden(e);} }
  return {ist, soll:S.settings.wochenSoll, diff:ist-S.settings.wochenSoll, hat};
}
/* Überstundenkonto: Startsaldo + Summe aller abgeschlossenen Wochen mit Einträgen */
function konto(bisMontag){
  const keys=Object.keys(S.days).sort();
  let start = S.settings.startDatum || keys[0];
  let saldo = num(S.settings.startSaldo);
  if(!start) return saldo;
  for(let mo=monday(parse(start)); mo<bisMontag; mo=addDays(mo,7)){
    const w=woche(mo); if(w.hat) saldo+=w.diff;
  }
  return saldo;
}
function monat(y,m){
  const r={std:0,arbeit:0,urlaub:0,krank:0,feiertag:0,frei:0,sonder:0,abbau:0,zuschlag:0};
  const p=`${y}-${pad(m+1)}-`;
  for(const [k,e] of Object.entries(S.days)){
    if(!k.startsWith(p)) continue;
    const h=stunden(e); r.std+=h; r[e.typ]=(r[e.typ]||0)+1;
    if(zuschlagP(e)) r.zuschlag+=h;
  }
  return r;
}

/* ---------- Mehrere Tage eintragen ---------- */
let fill={art:null,days:[]};
function kurz(e){
  if(!e) return '–';
  if(e.typ==='arbeit'){ const t=S.settings.schichten.find(t=>t.von===e.von&&t.bis===e.bis); return t?t.name:(e.von||'Arbeit'); }
  return TYPEN[e.typ].name;
}
function fillCard(mo){

/* ---------- Rente ---------- */
const mk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const de2 = s => s ? `${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(0,4)}` : '–';
function ymd(a,b){ // Jahre/Monate/Tage von a bis b
  let y=b.getFullYear()-a.getFullYear(), m=b.getMonth()-a.getMonth(), d=b.getDate()-a.getDate();
  if(d<0){ m--; d+=new Date(b.getFullYear(),b.getMonth(),0).getDate(); }
  if(m<0){ y--; m+=12; }
  return {y,m,d};
}
function renteCalc(beginnIso){
  const r=S.settings.rente, now=new Date(), cur=mk(now);
  const ys=Object.keys(r.de).map(Number).sort((a,b)=>a-b);
  const deY=y=>num(r.de[y]) || num(r.de[ys[ys.length-1]]);
  // seit Renteninformation: echte Lohndaten (abgeschlossene Monate)
  let epSeit=0, mitDaten=0, ohne=[];
  if(r.infoStand){
    const st=parse(r.infoStand);
    for(let d=new Date(st.getFullYear(),st.getMonth()+1,1); mk(d)<cur; d=new Date(d.getFullYear(),d.getMonth()+1,1)){
      const g=S.monate[mk(d)]||{}, b=num(g.brutto)+num(g.sonderBrutto);
      if(num(g.brutto)>0){ epSeit+=b/deY(d.getFullYear()); mitDaten++; } else ohne.push(MON[d.getMonth()].slice(0,3)+' '+String(d.getFullYear()).slice(2));
    }
  }
  // EP pro Jahr aus den letzten 12 Monaten mit Lohn
  let sum=0,n=0;
  for(let i=1;i<=24&&n<12;i++){ const d=new Date(now.getFullYear(),now.getMonth()-i,1), g=S.monate[mk(d)]||{}; if(num(g.brutto)>0){ sum+=num(g.brutto)+num(g.sonderBrutto); n++; } }
  const epJahr = n ? (sum/n*12)/deY(now.getFullYear()) : 0;
  const beginn = beginnIso ? parse(beginnIso) : null;
  const monRest = beginn ? Math.max(0,(beginn.getFullYear()-now.getFullYear())*12 + beginn.getMonth()-now.getMonth()) : 0;
  const epZuk = epJahr*monRest/12;
  const epInfo=num(r.infoEP), epExtra=num(r.epExtra);
  const epGes = epInfo+epSeit+epExtra+epZuk;
  // Abschlag / Zuschlag
  let faktor=1, ab='';
  if(beginn && r.regel){
    const regel=parse(r.regel), frei=r.frei?parse(r.frei):null;
    const diff=(regel.getFullYear()-beginn.getFullYear())*12 + regel.getMonth()-beginn.getMonth();
    if(diff>0 && frei && beginn>=frei) ab='abschlagsfrei';
    else if(diff>0){ const p=Math.min(diff*0.3,14.4); faktor=1-p/100; ab=`−${fmt(p)} % Abschlag (${diff} Mon. früher)`; }
    else if(diff<0){ const p=-diff*0.5; faktor=1+p/100; ab=`+${fmt(p)} % Zuschlag (${-diff} Mon. später)`; }
  }
  const rw=num(r.rentenwert), brutto=epGes*rw*faktor;
  const anp=Math.pow(1+num(r.anpassung)/100, monRest/12);
  const abzug=(7.3+num(r.kvZusatz)/2+num(r.pv))/100;
  return {epInfo,epSeit,mitDaten,ohne,epExtra,epJahr,monRest,epZuk,epGes,faktor,ab,rw,brutto,netto:brutto*(1-abzug),abzug,bruttoAnp:brutto*anp,nettoAnp:brutto*anp*(1-abzug)};
}

/* ---------- Steuer (Schätzung Einkommensteuer) ---------- */
/* § 32a EStG je Jahr + Lohnsteuer-Eckwerte (Kl. V), Beitragsbemessungsgrenzen, Minijob-Grenze */
const TARIF={
  2024:{g:11784,z2:17005,a:954.80,z3:66760,b:181.19,c:991.21,d:10636.31,e:18971.06,w:[13279,33380,222260],bbgR:90600,bbgK:62100,mini:538},
  2025:{g:12096,z2:17443,a:932.30,z3:68480,b:176.64,c:1015.13,d:10911.92,e:19246.67,w:[13785,34240,222260],bbgR:96600,bbgK:66150,mini:556},
  2026:{g:12348,z2:17799,a:914.51,z3:69878,b:173.10,c:1034.87,d:11135.63,e:19470.38,w:[14071,34939,222260],bbgR:101400,bbgK:69750,mini:603}
};
const tJahre = () => Object.keys(TARIF).map(Number).sort((a,b)=>a-b);
const tarifJahr = y => { const j=tJahre(); return y<=j[0] ? j[0] : j.filter(v=>v<=y).pop(); };
const tarifP = y => { const tj=tarifJahr(y), t=TARIF[tj]; return y>tj ? {...t, mini:MINIJOB[y]||t.mini} : t; };
function estT(x,P){
  x=Math.floor(x); if(x<=P.g) return 0;
  if(x<=P.z2){ const y=(x-P.g)/1e4; return Math.floor((P.a*y+1400)*y); }
  if(x<=P.z3){ const z=(x-P.z2)/1e4; return Math.floor((P.b*z+2397)*z+P.c); }
  if(x<=277825) return Math.floor(0.42*x-P.d);
  return Math.floor(0.45*x-P.e);
}
/* Jahres-Lohnsteuer nach Steuerklasse (Programmablauf vereinfacht, Vorsorgepauschale RV/KV/PV) */
function lstJahr(b,kl,P,G){
  if(!(b>0) || !kl) return 0;
  const vsp = 0.093*Math.min(b,P.bbgR) + (0.07+G.kvZ/200+G.pv/100)*Math.min(b,P.bbgK);
  const X = Math.max(0, Math.floor(b-1230-36-vsp));
  if(kl==3) return 2*estT(X/2,P);
  if(kl==5){
    const up = zx => Math.max(2*(estT(zx*1.25,P)-estT(zx*0.75,P)), Math.floor(zx*0.14)), [w1,w2,w3]=P.w;
    if(X>w2) return Math.floor(up(w2) + (X>w3 ? (w3-w2)*0.42+(X-w3)*0.45 : (X-w2)*0.42));
    let st=up(X); if(X>w1) st=Math.min(st, up(w1)+(X-w1)*0.42); return Math.floor(st);
  }
  return estT(X,P);
}
/* Midijob: beitragspflichtige Einnahme des Arbeitnehmers im Übergangsbereich */
const midiBE = (m,P) => (m>P.mini && m<=2000) ? 2000/(2000-P.mini)*(m-P.mini) : m;
/* Eingaben: "1.234,56" / "1234.56" / "1.500" */
const numDE = v => { let s=String(v??'').trim().replace(/\s|€/g,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); const n=parseFloat(s); return isFinite(n)?n:0; };
const leer = v => v===''||v==null;
const e0 = n => Math.round(n).toLocaleString('de-DE')+' €';
const ST_DEF = {ich:{stkl:4, lohn:'', sonder:'', lst:'', wk:'', aend:[]}, p:{stkl:4, monat:'', sonder:'', midi:false, lst:'', wk:'', aend:[]}, vz:'', hw:'', abz:''};
/* Monatsbrutto in Monat m (0–11): letzte Gehaltsänderung „ab Monat“ bis dahin, sonst Basiswert */
const aendVal = (arr,m,basis) => { let v=basis; for(const a of (arr||[]).slice().sort((x,y)=>x.ab-y.ab)) if(+a.ab<=m+1 && !leer(a.b)) v=+a.b; return v; };
const stFill = o => ({...structuredClone(ST_DEF), ...o, ich:{...ST_DEF.ich, ...(o.ich||{})}, p:{...ST_DEF.p, ...(o.p||{})}});
/* Werte eines Jahres – ohne eigene Werte werden die des letzten Jahres davor angezeigt */
function stY(y,create){
  S.steuer=S.steuer||{};
  if(S.steuer[y]) return {d:(S.steuer[y]=stFill(S.steuer[y])), von:null};
  const prev=Object.keys(S.steuer).map(Number).filter(v=>v<y).sort((a,b)=>b-a)[0];
  const d = prev ? stFill(structuredClone(S.steuer[prev])) : stFill({});
  if(prev){ d.ich.lst=''; d.p.lst=''; d.p.monat = aendVal(d.p.aend,11,leer(d.p.monat)?0:+d.p.monat)||''; d.p.aend=[]; d.ich.aend=[]; }
  if(create){ S.steuer[y]=d; return {d, von:null}; }
  return {d, von:prev||null};
}
/* Dein Lohn aus den Monaten der App; fehlende Monate am Ende des Jahres werden hochgerechnet */
function lohnApp(y,aend){
  const nowY=new Date().getFullYear(); let lohn=0, sonder=0, last=-1, hoch=0; const b=[];
  for(let m=0;m<12;m++){ const g=S.monate[`${y}-${pad(m+1)}`]||{}; b[m]=numDE(g.brutto); sonder+=numDE(g.sonderBrutto); if(b[m]>0){ lohn+=b[m]; last=m; } }
  // noch nicht eingetragene Monate: Gehaltsänderung „ab Monat“, sonst letzter Monat hochgerechnet
  if(y>=nowY) for(let m=last+1;m<12;m++){ const v=aendVal(aend,m,last>=0?b[last]:0); if(v>0){ lohn+=v; hoch++; } }
  return {lohn, sonder, hoch};
}
function steuerCalc(y){
  const {d,von}=stY(y), G=S.settings.steuer, P=tarifP(y), verh=!!G.verh, n=v=>leer(v)?0:(+v||0);
  const app=lohnApp(y,d.ich.aend);
  const iLohn = leer(d.ich.lohn) ? app.lohn : n(d.ich.lohn), iSon = leer(d.ich.sonder) ? app.sonder : n(d.ich.sonder), iB=iLohn+iSon;
  const pM = Array.from({length:12},(_,m)=>aendVal(d.p.aend,m,n(d.p.monat)));
  const pB = verh ? pM.reduce((a,v)=>a+v,0) + n(d.p.sonder) : 0;
  const klI = verh ? +d.ich.stkl : 1, klP = verh ? +d.p.stkl : 0;
  const lIc=lstJahr(iB,klI,P,G), lPc=lstJahr(pB,klP,P,G);
  const lI = leer(d.ich.lst) ? lIc : n(d.ich.lst), lP = verh ? (leer(d.p.lst) ? lPc : n(d.p.lst)) : 0;
  const eI=Math.max(0, iB-Math.max(1230,n(d.ich.wk))), eP=verh ? Math.max(0, pB-Math.max(1230,n(d.p.wk))) : 0;
  const kvS=0.073+G.kvZ/200, pvS=G.pv/100;
  const sv = be => ({rv:0.093*Math.min(be,P.bbgR), kv:kvS*Math.min(be,P.bbgK), pv:pvS*Math.min(be,P.bbgK)});
  const sI=sv(iB), sP=sv(verh ? (d.p.midi ? pM.reduce((a,v)=>a+midiBE(v,P),0) + n(d.p.sonder) : pB) : 0);
  const vors = sI.rv+sP.rv + 0.96*(sI.kv+sP.kv) + sI.pv+sP.pv;   // Altersvorsorge voll, KV ohne Krankengeld-Anteil (−4 %)
  const sa = Math.max(verh?72:36, n(d.abz));
  const zve = Math.max(0, Math.floor(eI+eP-vors-sa));
  const est0 = verh ? 2*estT(Math.floor(zve/2),P) : estT(zve,P);
  const erm = Math.min(Math.round(0.2*n(d.hw)), 5200), est=Math.max(0, est0-erm);
  const vz=n(d.vz), lst=lI+lP, rest=est-lst-vz;

  if(verh && iB && pB) vgl=[[3,5],[4,4],[5,3]].map(([a,b])=>{ const l=lstJahr(iB,a,P,G)+lstJahr(pB,b,P,G); return {k:`${a}/${b}`, l, erg:est-l, akt:a===klI&&b===klP}; });
  return {d,von,verh,app,iB,iLohn,iSon,pB,klI,klP,lI,lP,lIc,lPc,wk:(iB-eI)+(pB-eP),vors,sa,zve,est0,erm,est,vz,lst,rest,vgl,tj:tarifJahr(y)};
}

/* ---------- Änderungsprotokoll ---------- */
/* Jede Änderung an einem schon eingetragenen Tag wird mit Zeitpunkt gespeichert */
function logChange(s,a,n){
  S.log=S.log||[]; const now=Date.now();
  for(let i=S.log.length-1;i>=0;i--){ const x=S.log[i];
    if(now-x.t>6e5) break;                       // älter als 10 Minuten → neuer Eintrag
    if(x.d===s){ x.n=n?structuredClone(n):null; x.t=now; if(JSON.stringify(x.a)===JSON.stringify(x.n)) S.log.splice(i,1); return; }
  }
  S.log.push({t:now, d:s, a:structuredClone(a), n:n?structuredClone(n):null});
  if(S.log.length>800) S.log.splice(0,S.log.length-800);
}
function descr(e){
  if(!e) return 'gelöscht';
  if(e.typ==='arbeit'){ const t=S.settings.schichten.find(t=>t.von===e.von&&t.bis===e.bis); return (t?t.name+' ':'')+(e.von?`${e.von}–${e.bis}`:'Arbeit'); }
  return TYPEN[e.typ].name;
}
const dtKurz = t => { const d=new Date(t); return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function vorlauf(x){ const at=new Date(x.t), n=Math.round((parse(x.d)-new Date(at.getFullYear(),at.getMonth(),at.getDate()))/864e5); return n; }
function logZeile(x,mitTag){
  const a=descr(x.a), n=descr(x.n), v=vorlauf(x), d=parse(x.d);
  let was = a!==n ? `${esc(a)} → <b>${esc(n)}</b>` : (x.a?.notiz||'')!==(x.n?.notiz||'') ? `Bemerkung: „${esc(x.a?.notiz||'–')}“ → „${esc(x.n?.notiz||'–')}“` : `${esc(n)} – Details geändert`;
  const vt = v>1?`${v} Tage vorher` : v===1?'1 Tag vorher' : v===0?'am selben Tag' : 'nachträglich';
  const kf = v>=0 && v<=3;
  return `<div class="log">${mitTag?`<b>${WT[d.getDay()]} ${ddmm(d)}${d.getFullYear()}</b> · `:''}${was}
    <div class="muted" style="font-size:12px">geändert am ${dtKurz(x.t)} · <span class="${kf?'k':''}">${vt}${kf?' – kurzfristig':''}</span></div></div>`;
}
const geaendert = () => new Set((S.log||[]).map(x=>x.d));

/* ---------- Auswertung ---------- */
function bloecke(y,typ){
  const tage=Object.keys(S.days).filter(k=>k.startsWith(y+'-') && S.days[k].typ===typ).sort(), out=[];
  const bruecke = s => { const e=S.days[s]; if(e && !['frei','feiertag'].includes(e.typ)) return false; return parse(s).getDay()===0 || !!feiertag(s) || e?.typ==='feiertag' || e?.typ==='frei'; };
  for(const s of tage){
    const l=out[out.length-1];
    if(l){ let d=addDays(parse(l.bis),1), ok=true; while(iso(d)<s){ if(!bruecke(iso(d))){ ok=false; break; } d=addDays(d,1); } if(ok){ l.bis=s; l.n++; continue; } }
    out.push({von:s,bis:s,n:1});
  }
  return out;
}
const tagKurz = s => { const d=parse(s); return `${WT[d.getDay()]} ${ddmm(d)}`; };
function blockListe(y,typ){
  const b=bloecke(y,typ), heute=iso(new Date());
  if(!b.length) return '<div class="muted">Keine Einträge.</div>';
  return b.map(x=>{ const st = x.von>heute?'geplant' : x.bis<heute?'' : 'läuft';
    return `<div class="blk ${x.von>heute?'plan':''}" data-wk="${x.von}"><span>${x.von===x.bis?tagKurz(x.von):`${tagKurz(x.von)} – ${tagKurz(x.bis)}`}${st?` <span class="tag">${st}</span>`:''}</span><b>${x.n} Tag${x.n>1?'e':''}</b></div>`; }).join('');
}

  const fokus = m<=3 ? `Schwerpunkt jetzt (Jahresbeginn ${y}): Einkommensteuertarif ${y}, Lohnsteuer-Programmablaufplan ${y} (W-Werte Steuerklasse V), Beitragsbemessungsgrenzen ${y}, Minijob-Grenze ${y}, Durchschnittsentgelt ${y} (vorläufig) und ${y-2} (endgültig), durchschnittlicher KV-Zusatzbeitrag ${y}.`
             : m<=8 ? `Schwerpunkt jetzt: neuer Rentenwert ab 01.07.${y}.`
             : `Schwerpunkt jetzt: Ist der Einkommensteuertarif ${y+1} schon beschlossen? Gibt es die Rechengrößen der Sozialversicherung ${y+1} schon?`;
  return `Bitte prüfe die aktuellen deutschen Rechenwerte für meine Zeiterfassungs-App und gib mir eine aktualisierte Datei werte.json zurück – vollständig, im exakt gleichen Format wie unten, als EINEN Codeblock, damit ich ihn kopieren kann.

Heute ist der ${deD(d)}. ${fokus}

Bitte mit Websuche bei offiziellen Quellen prüfen (Gesetze im Internet, Bundesfinanzministerium, Deutsche Rentenversicherung, Bundesregierung):

2. Lohnsteuer Steuerklasse V: W1STKL5, W2STKL5, W3STKL5 aus dem Programmablaufplan des Jahres → "w".
3. Beitragsbemessungsgrenze Rentenversicherung "bbgR" und Kranken-/Pflegeversicherung "bbgK" (jährlich).
4. Minijob-Grenze pro Monat "mini" (künftige Jahre unter "minijob").
5. Aktueller Rentenwert "rentenwert" und ab wann "rentenwertAb".
6. Durchschnittsentgelt "de" je Jahr; endgültige Jahre in "deEndgueltig".
7. Durchschnittlicher KV-Zusatzbeitrag in Prozent "kvZusatz".

Regeln: Nur offiziell beschlossene Werte, keine Entwürfe. Vorhandene Jahre nicht löschen. "stand" auf das heutige Datum (JJJJ-MM-TT) setzen und unter "neu" kurz auflisten, was sich geändert hat. Wenn sich nichts geändert hat, sag mir das einfach – dann muss ich nichts hochladen. Falls du keine Websuche hast, sag es bitte, statt Werte zu raten.

Aktuelle werte.json:
${JSON.stringify(werteAktuell(),null,1)}`;

function copyText(t){
  const ok=()=>toast('Text kopiert ✓');
  const alt=()=>{ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='0'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length); try{ document.execCommand('copy'); ok(); }catch(e){ toast('Kopieren nicht möglich'); } ta.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,alt); else alt();
}

function wcItems(){
  const heute=iso(new Date()), y=new Date().getFullYear(), start=S.wcStart||heute, out=[];
  for(const w of WC){
    const dt=`${y}-${pad(w.m)}-${pad(w.d)}`;
    if(dt>heute || dt<start) continue;
    const schon = w.m===1 ? `${y-1}-12-01` : `${y}-${pad(w.m)}-01`;
    if(WERTE && WERTE.stand>=schon) continue;
    out.push({id:`wc-${y}-${w.m}`, ic:'🔄', t:`Rechenwerte prüfen (${w.t} ${y})`, due:dt, b:`<p>${w.txt}</p>${WC_ANLEITUNG}`});
  }
  return out;
}

function faellig(){
  const heute=iso(new Date()), E=S.erinn||{}, out=[];
  for(const s of fahrplan()){ const z=E[s.id]||{}; if(!z.done && s.due<=heute && !(z.snooze && z.snooze>heute)) out.push(s); }
  if(WERTE && S.werteSeen && WERTE.stand>S.werteSeen) out.unshift({id:'werte', ic:'📢', t:'Neue Rechenwerte', info:true, b:`<p>Stand <b>${de2(WERTE.stand)}</b>:</p><ul>${(WERTE.neu||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="muted">Steuer-Check und Rentenrechner rechnen ab sofort damit.</p>`});
  for(const w of wcItems()){ const z=E[w.id]||{}; if(!z.done && !(z.snooze && z.snooze>heute)) out.push(w); }
  const bt=+S.settings.backupTage||0, z=E.backup||{};
  if(bt>0 && Object.keys(S.days).length && !(z.snooze && z.snooze>heute)){ const l=S.lastBackup||0; if(!l || (Date.now()-l)/864e5>=bt) out.push(backupItem()); }
  return out;
}

/* ---------- Rechenwerte automatisch (werte.json im Repo) ---------- */
const WKEY='zeiterfassung-werte', MINIJOB={2027:633};
let WERTE=null;
function applyWerte(w){
  if(!w || typeof w!=='object' || !w.stand) return false;
  const vorher=JSON.stringify([TARIF,S.settings.rente]);
  WERTE=w;
  // nur vollständige und plausible Werte übernehmen – sonst bleiben die alten
  const zw=(v,a,b)=>isFinite(+v) && +v>=a && +v<=b;
  for(const [y,t] of Object.entries(w.steuer||{})){ const n=+y;
    if(n>=2020 && n<=2100 && t && ['g','z2','a','z3','b','c','d','e','w','bbgR','bbgK','mini'].every(k=>t[k]!=null)
       && zw(t.g,9000,25000) && zw(t.z2,t.g,40000) && zw(t.z3,t.z2,150000) && zw(t.a,500,1500) && zw(t.b,100,400) && zw(t.c,500,3000) && zw(t.d,5000,30000) && zw(t.e,10000,50000)
       && Array.isArray(t.w) && t.w.length===3 && t.w.every(v=>zw(v,5000,400000)) && zw(t.bbgR,50000,250000) && zw(t.bbgK,40000,200000) && zw(t.mini,300,1500)) TARIF[n]=t; }
  for(const [y,v] of Object.entries(w.minijob||{})) if(zw(v,300,1500)) MINIJOB[y]=+v;
  const r=S.settings.rente;
  if(r.auto!==false && w.rente){
    if(zw(w.rente.rentenwert,30,90)) r.rentenwert=+w.rente.rentenwert;
    if(w.rente.de) for(const [y,v] of Object.entries(w.rente.de)) if(zw(v,30000,120000)) r.de[y]=+v;
    if(w.rente.kvZusatz!=null && zw(w.rente.kvZusatz,0,8)) r.kvZusatz=+w.rente.kvZusatz;
  }
  return vorher!==JSON.stringify([TARIF,S.settings.rente]);
}
function ladeWerte(){
  fetch('werte.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(w=>{
    if(!w || !w.stand) return;
    try{ localStorage.setItem(WKEY, JSON.stringify(w)); }catch(e){}
    const geaendert=applyWerte(w);
    if(!S.werteSeen) S.werteSeen=w.stand;          // beim ersten Mal still übernehmen
    save(); if(geaendert) softRender();
    setTimeout(checkPop,500);
  }).catch(()=>{});
}

const deDat = s => { const d=parse(s); return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`; };
function runShortcut(name, text){
  location.href='shortcuts://run-shortcut?name='+encodeURIComponent(name)+'&input=text&text='+encodeURIComponent(text);
}
/* Eine Zeile pro Tag:  TT.MM.JJJJ|Titel|Start|Ende|Ort|Notiz
   nur Datum = an dem Tag Edeka/Urlaub löschen, nichts Neues eintragen */
function kalLine(s){
  const k=S.settings.kal, e=S.days[s], d=deDat(s), clean=x=>String(x||'').replace(/[|\r\n]+/g,' ').trim();
  if(!e) return d;
  if(!k.typen.includes(e.typ)) return null;
  if(e.typ==='arbeit'){
    if(!e.von||!e.bis) return null;
    const endD = toMin(e.bis)<toMin(e.von) ? iso(addDays(parse(s),1)) : s;
    const n=(e.notiz||'').toLowerCase(), w=(k.regelWort||'').toLowerCase();
    const ort = (w && k.regelOrt && n.includes(w)) ? k.regelOrt : k.ort;
    const tp=S.settings.schichten.find(t=>t.von===e.von&&t.bis===e.bis);
    const info=[tp?tp.name:'Schicht', clean(e.notiz)].filter(Boolean).join(' · ');
    return [d,'Edeka',`${d} ${e.von}`,`${deDat(endD)} ${e.bis}`,clean(ort)||'EDEKA',info].join('|');
  }
  if(e.typ==='urlaub' && k.urlaubGanz) return `${d}|Urlaub`;
  return d;
}
function commitKal(dates){
  const k=S.settings.kal; if(!k.an || !dates.length) return;
  for(const s of dates) if(!S.kalQ.includes(s)) S.kalQ.push(s);
  save(); renderKalBar();
  // Zwischenablage muss direkt beim Antippen beschrieben werden, die Kurzbefehle-App erst nach dem Neuzeichnen öffnen
  if(k.sofort){ if(k.modus==='clip') sendKal(); else setTimeout(sendKal,350); }
}
function sendKal(){
  const k=S.settings.kal, lines=S.kalQ.slice().sort().map(kalLine).filter(Boolean);
  S.kalQ=[]; save(); renderKalBar();
  if(!lines.length) return toast('Nichts für den Kalender zu tun');
  S.kalLast=lines.join('\n'); save();
  if(k.modus==='clip'){ copyText(S.kalLast); setTimeout(()=>toast('📋 Kopiert – jetzt 2× hinten aufs iPhone tippen',4500),60); return; }
  if(!k.name) return toast('Kein Kurzbefehl eingetragen');
  runShortcut(k.name, S.kalLast);
}
function renderKalBar(){
  const el=document.getElementById('kalbar'), q=S.kalQ||[];
  el.innerHTML = (S.settings.kal.an && q.length) ? `<div class="kalbar"><span>📅 ${q.length} Kalender-Änderung${q.length>1?'en':''}</span><button data-act="kalsend">Senden</button><button class="x" data-act="kalclear" aria-label="Verwerfen">✕</button></div>` : '';
}
/* ---------- Zeitraum ---------- */
let rng=null;
function openRange(){
  edit=null;
  rng={typ:'urlaub', von:iso(curMon), bis:iso(addDays(curMon,5)), ohneSo:true, ohneFt:true};
  drawRange();
  document.getElementById('sheet').classList.add('open'); document.getElementById('sheetBg').classList.add('open');
}
function rangeDays(){
  const out=[]; if(!rng.von||!rng.bis) return out;
  let a=parse(rng.von), b=parse(rng.bis); if(b<a) [a,b]=[b,a];
  for(let d=a; d<=b && out.length<366; d=addDays(d,1)){
    const s=iso(d);
    if(rng.ohneSo && d.getDay()===0) continue;
    if(rng.ohneFt && feiertag(s)) continue;
    out.push(s);
  }
  return out;
}
function drawRange(){
  const typs=['urlaub','krank','frei','abbau','sonder'], n=rangeDays();
  document.getElementById('sheet').innerHTML=`
    <div class="nav" style="margin-bottom:10px"><b>Zeitraum eintragen</b><button class="iconbtn" data-act="close">✕</button></div>
    <div class="seg">${typs.map(t=>`<button data-rtyp="${t}" class="${rng.typ===t?'on':''}">${TYPEN[t].name}</button>`).join('')}</div>
    <div class="grid2">
      <div><label class="f">Von</label><input type="date" id="rVon" value="${rng.von}"></div>
      <div><label class="f">Bis</label><input type="date" id="rBis" value="${rng.bis}"></div>
    </div>
    <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rSo" ${rng.ohneSo?'checked':''}> Sonntage auslassen</label>
    <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rFt" ${rng.ohneFt?'checked':''}> Feiertage auslassen (bleiben Feiertag)</label>
    <div class="calc" id="rCalc">${n.length} Tage als ${TYPEN[rng.typ].name}</div>
    <div class="hint">Vorhandene Einträge an diesen Tagen werden überschrieben.</div>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button class="btn primary" data-act="rsave" style="flex:1;max-width:260px">Eintragen</button>
    </div>`;
}

/* ---------- Export / Import ---------- */
function download(name,text,type){
  const b=new Blob([text],{type}); const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportCSV(){
  const lines=['Datum;Tag;Typ;Von;Bis;Pause;Std;Zuschlag;Bemerkung'];
  for(const k of Object.keys(S.days).sort()){
    const e=S.days[k], d=parse(k);
    lines.push([`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`,WT[d.getDay()],TYPEN[e.typ].name,e.von||'',e.bis||'',e.typ==='arbeit'&&e.von?e.pause:'',fmt(stunden(e)),zuschlagP(e)?zuschlagP(e)+'%':'',`"${(e.notiz||'').replace(/"/g,'""')}"`].join(';'));
  }
  download(`zeiterfassung-${iso(new Date())}.csv`,'\ufeff'+lines.join('\r\n'),'text/csv');
}

const onClick=ev=>{
  const t=ev.target.closest('[data-act],[data-edit],[data-go],[data-coll],[data-fart],[data-fday],[data-kaltyp],[data-tpldel],[data-month],[data-stkl],[data-wk],[data-popid],[data-aendadd],[data-aenddel],[data-kalmodus]'); if(!t) return;
  if(t.dataset.go){ tab=t.dataset.go; render(); scrollTo(0,0); return; }
  if(t.dataset.coll){ const id=t.dataset.coll, c=t.closest('.coll'), auf=!c.classList.contains('open'); UI[id]=auf; uiSave(); c.classList.toggle('open',auf); return; }
  if(t.dataset.fart){ fill.art = fill.art===t.dataset.fart?null:t.dataset.fart; return render(); }
  if(t.dataset.fday){ const s=t.dataset.fday; fill.days = fill.days.includes(s)?fill.days.filter(x=>x!==s):[...fill.days,s]; return render(); }
  if(t.dataset.kalmodus){ S.settings.kal.modus=t.dataset.kalmodus; save(); const y0=scrollY; render(); scrollTo(0,y0); return toast(t.dataset.kalmodus==='clip'?'Übertragen per Rückseite tippen':'Übertragen per Kurzbefehle-App'); }
  if(t.dataset.aendadd||t.dataset.aenddel){ const d=stY(curYear,true).d, y0=scrollY;
    if(t.dataset.aendadd){ const w=t.dataset.aendadd; d[w].aend=d[w].aend||[]; const nm=curYear===new Date().getFullYear()?Math.min(12,new Date().getMonth()+2):1; d[w].aend.push({ab:nm,b:''}); }
    else { const [w,i]=t.dataset.aenddel.split(':'); d[w].aend.splice(+i,1); }
    save(); render(); scrollTo(0,y0); return; }
  if(t.dataset.wk){ curMon=monday(parse(t.dataset.wk)); tab='woche'; render(); scrollTo(0,0); return; }
  if(t.dataset.popid){ const it=fahrplan().find(x=>x.id===t.dataset.popid); if(it) showPop(it,true); return; }
  if(t.dataset.stkl){ const [w,k]=t.dataset.stkl.split(':'), d=stY(curYear,true).d, paar={3:5,4:4,5:3}; d[w].stkl=+k; d[w==='ich'?'p':'ich'].stkl=paar[k]; save(); const y0=scrollY; render(); scrollTo(0,y0); return; }
  if(t.dataset.edit) return openEdit(t.dataset.edit);
  if(t.dataset.month){ curMonth=new Date(curYear,+t.dataset.month,1); tab='monat'; return render(); }
  if(t.dataset.kaltyp){ const a=S.settings.kal.typen, x=t.dataset.kaltyp; S.settings.kal.typen = a.includes(x)?a.filter(v=>v!==x):[...a,x]; save(); return render(); }
  if(t.dataset.tpldel!==undefined){ if(confirm('Vorlage löschen?')){ S.settings.schichten.splice(+t.dataset.tpldel,1); save(); render(); } return; }
  switch(t.dataset.act){
    case 'wprev': curMon=addDays(curMon,-7); fill.days=[]; break;
    case 'wnext': curMon=addDays(curMon,7); fill.days=[]; break;
    case 'wtoday': curMon=monday(new Date()); fill.days=[]; break;
    case 'fillmosa': fill.days=[0,1,2,3,4,5].map(i=>iso(addDays(curMon,i))); break;
    case 'fillnone': fill.days=[]; break;
    case 'fillgo': {
      if(!fill.art||!fill.days.length) return toast('Erst Auswahl und Tage wählen');
      const ch=[], n=fill.days.length;
      for(const s of fill.days){
        let e;
        if(fill.art.startsWith('tpl:')){ const tp=S.settings.schichten[+fill.art.slice(4)]; e={typ:'arbeit',von:tp.von,bis:tp.bis,pause:tp.pause}; const alt=S.days[s]; if(alt?.typ==='arbeit'&&alt.notiz) e.notiz=alt.notiz; }
        else e={typ:fill.art};
        if(setDay(s,e)) ch.push(s);
      }
      fill.days=[]; save(); commitKal(ch); render(); return toast(`${n} Tag${n>1?'e':''} eingetragen`);
    }
    case 'kalsend': sendKal(); return;
    case 'kalclear': if(confirm('Gesammelte Kalender-Änderungen verwerfen? Der Kalender wird dann nicht angepasst.')){ S.kalQ=[]; save(); renderKalBar(); } return;
    case 'kalweek': {
      if(!S.settings.kal.an) return toast('Erst „Kalender automatisch anpassen“ einschalten');
      // nur Tage mit Eintrag – leere Tage würden sonst die Schicht im Kalender löschen
      const tage=[0,1,2,3,4,5,6].map(i=>iso(addDays(curMon,i))).filter(s=>S.days[s]);
      if(!tage.length) return toast(`KW ${kw(curMon)} hat in der App keine Einträge – Kalender bleibt unverändert`);
      if(!confirm(`${tage.length} eingetragene Tag${tage.length>1?'e':''} der KW ${kw(curMon)} an den Kalender senden? Edeka- und Urlaubstermine dieser Tage werden neu eingetragen. Tage ohne Eintrag in der App bleiben im Kalender unverändert.`)) return;
      for(const s of tage) if(!S.kalQ.includes(s)) S.kalQ.push(s);
      sendKal(); return; }
    case 'mprev': curMonth=new Date(curMonth.getFullYear(),curMonth.getMonth()-1,1); break;
    case 'mnext': curMonth=new Date(curMonth.getFullYear(),curMonth.getMonth()+1,1); break;
    case 'yprev': curYear--; break;
    case 'ynext': curYear++; break;
    case 'copynext': {
      const y=curMonth.getFullYear(), m=curMonth.getMonth(), g=S.monate[`${y}-${pad(m+1)}`]||{};
      if(!g.brutto && !g.netto) return toast('Erst Brutto/Netto eintragen');
      if(!confirm(`Brutto ${g.brutto||'–'} € und Netto ${g.netto||'–'} € für ${MON[m+1]}–Dezember ${y} übernehmen? Dort eingetragene Werte werden ersetzt, Sonderzahlungen bleiben.`)) return;
      for(let i=m+1;i<12;i++){ const k=`${y}-${pad(i+1)}`; S.monate[k]={...(S.monate[k]||{}), brutto:g.brutto||'', netto:g.netto||''}; }
      save(); toast(`Übertragen auf ${11-m} Monat${11-m>1?'e':''}`); break; }
    case 'copyprev': {
      const p=new Date(curMonth.getFullYear(),curMonth.getMonth()-1,1), pk=`${p.getFullYear()}-${pad(p.getMonth()+1)}`;
      if(!S.monate[pk]) return toast('Vormonat ohne Lohnangaben');
      S.monate[`${curMonth.getFullYear()}-${pad(curMonth.getMonth()+1)}`]={...S.monate[pk]}; save(); toast('Übernommen'); break; }
    case 'tpladd': S.settings.schichten.push({name:'Neu',von:'08:00',bis:'16:00',pause:30}); save(); break;
    case 'export': S.lastBackup=Date.now(); save(); download(`zeiterfassung-backup-${iso(new Date())}.json`,JSON.stringify({app:'zeiterfassung',version:APP_VERSION,...S},null,1),'application/json'); return;
    case 'import': document.getElementById('impFile').click(); return;
    case 'csv': exportCSV(); return;
    case 'wertecopy': copyText(wertePrompt()); return;
    case 'kallast': if(S.kalLast){ copyText(S.kalLast); setTimeout(()=>toast('📋 Kopiert – jetzt 2× hinten aufs iPhone tippen',4500),60); } return;
    case 'range': openRange(); return;
  }
  render();
};

/* Neu zeichnen erst, wenn kein Eingabefeld mehr aktiv ist (sonst verliert man den Fokus) */
let pendingRender=false;
const isTyping = el => el && ((el.tagName==='INPUT' && !/^(checkbox|radio|button|file)$/.test(el.type)) || el.tagName==='SELECT' || el.tagName==='TEXTAREA');
function softRender(){
  pendingRender=true;
  setTimeout(()=>{ if(!pendingRender) return; const a=document.activeElement; if(isTyping(a) && app.contains(a)) return; pendingRender=false; const y=scrollY; render(); scrollTo(0,y); },350);
}
app.addEventListener('focusout',()=>{ if(pendingRender) softRender(); });
app.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset.money){
    const k=`${curMonth.getFullYear()}-${pad(curMonth.getMonth()+1)}`;
    S.monate[k]=S.monate[k]||{}; S.monate[k][el.dataset.money]=el.value.trim(); save(); softRender(); return;
  }
  if(el.dataset.rauto!==undefined){ const r=S.settings.rente; r.auto=el.checked; if(el.checked && WERTE) applyWerte(WERTE); save(); softRender(); toast(el.checked?'Automatik an':'Automatik aus'); return; }
  if(el.dataset.rente && ['rentenwert','kvZusatz'].includes(el.dataset.rente)) S.settings.rente.auto=false;
  if(el.dataset.rde) S.settings.rente.auto=false;
  if(el.dataset.rente){ const k=el.dataset.rente, v=el.value.trim(); S.settings.rente[k] = el.type==='date' ? v : (v===''?'':num(v)); save(); softRender(); toast('Gespeichert'); return; }
  if(el.dataset.rde){ const v=el.value.trim(); if(v==='') delete S.settings.rente.de[el.dataset.rde]; else S.settings.rente.de[el.dataset.rde]=num(v); save(); softRender(); toast('Gespeichert'); return; }
  if(el.dataset.erl){ setErledigt(el.dataset.erl, el.checked); toast(el.checked?'Erledigt ✓':'Wieder offen'); softRender(); return; }
  if(el.dataset.aend){ const [w,i,f]=el.dataset.aend.split(':'), a=stY(curYear,true).d[w].aend[+i]; if(!a) return;
    a[f] = f==='ab' ? +el.value : (el.value.trim()===''?'':numDE(el.value)); save(); softRender(); toast('Gespeichert'); return; }
  if(el.dataset.st){
    const d=stY(curYear,true).d, [a,b]=el.dataset.st.split('.'), v = el.type==='checkbox' ? el.checked : (el.value.trim()==='' ? '' : numDE(el.value));
    if(b) d[a][b]=v; else d[a]=v; save(); softRender(); toast('Gespeichert'); return;
  }
  if(el.dataset.stg){
    const k=el.dataset.stg, G=S.settings.steuer;
    G[k] = el.type==='checkbox' ? el.checked : k==='pName' ? el.value.trim() : numDE(el.value);
    save(); softRender(); toast('Gespeichert'); return;
  }
  if(el.dataset.ujahr){
    S.urlaubJahr=S.urlaubJahr||{}; const v=el.value.trim();
    if(v==='') delete S.urlaubJahr[el.dataset.ujahr]; else S.urlaubJahr[el.dataset.ujahr]=num(v);
    save(); softRender(); toast('Gespeichert'); return;
  }
  if(el.dataset.set){
    const k=el.dataset.set;
    if(el.type==='checkbox') S.settings[k]=el.checked;
    else if(k==='startDatum') S.settings[k]=el.value ? iso(monday(parse(el.value))) : '';
    else S.settings[k]=num(el.value);
    save(); softRender(); toast('Gespeichert'); return;
  }
  if(el.dataset.kal){ const k=el.dataset.kal; S.settings.kal[k]= el.type==='checkbox'?el.checked:el.value.trim(); save(); if(el.type==='checkbox') softRender(); else renderKalBar(); toast('Gespeichert'); return; }
  if(el.dataset.tplf){
    const [i,f]=el.dataset.tplf.split(':'); S.settings.schichten[+i][f]= f==='pause'?(parseInt(el.value)||0):el.value; save(); return;
  }
  if(el.id==='impFile' && el.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{ try{
      const d=JSON.parse(fr.result); if(!d.days) throw 0;
      const nT=Object.keys(d.days).length;
      if(!confirm(nT?`Backup mit ${nT} Tagen laden? Vorhandene Einträge mit gleichem Datum werden überschrieben.`:'Einstellungen aus der Datei übernehmen?')) return;
      Object.assign(S.days,d.days); Object.assign(S.monate,d.monate||{}); if(d.urlaubJahr) S.urlaubJahr=Object.assign(S.urlaubJahr||{},d.urlaubJahr); if(d.steuer) S.steuer=Object.assign(S.steuer||{},d.steuer); if(d.settings) S.settings=Object.assign(S.settings,d.settings);
      save(); load(); render(); toast(nT?'Backup geladen':'Übernommen');
    }catch(e){ alert('Datei konnte nicht gelesen werden.'); } };
    fr.readAsText(el.files[0]); el.value='';
  }
});

const sheet=document.getElementById('sheet');
sheet.addEventListener('click',ev=>{
  const t=ev.target.closest('button'); if(!t) return;
  if(t.dataset.rtyp){ readRange(); rng.typ=t.dataset.rtyp; return drawRange(); }
  if(t.dataset.typ){ readSheet(); edit.typ=t.dataset.typ; if(edit.typ==='arbeit'&&edit.pause==null) edit.pause=30; return drawSheet(); }
  if(t.dataset.tpl!==undefined){ readSheet(); const tp=S.settings.schichten[+t.dataset.tpl]; Object.assign(edit,{von:tp.von,bis:tp.bis,pause:tp.pause}); return drawSheet(); }
  switch(t.dataset.act){
    case 'close': rng=null; return closeSheet();
    case 'rsave': {
      readRange(); const tage=rangeDays();
      if(!tage.length) return toast('Keine Tage im Zeitraum');
      const ch=[];
      for(const s of tage){ if(setDay(s,{typ:rng.typ})) ch.push(s); }
      if(rng.ohneFt){ let a=parse(rng.von), b=parse(rng.bis); if(b<a) [a,b]=[b,a];
        for(let d=a; d<=b; d=addDays(d,1)){ const s=iso(d); if(feiertag(s) && !S.days[s] && setDay(s,{typ:'feiertag'})) ch.push(s); } }
      rng=null;
      save(); closeSheet(); commitKal(ch); render(); toast(`${tage.length} Tage eingetragen`);
      return;
    }
    case 'del': { const s=edit._s; const ch=setDay(s,null); save(); closeSheet(); if(ch) commitKal([s]); render(); return toast('Gelöscht'); }
    case 'save': {
      readSheet(); const s=edit._s, e={typ:edit.typ};
      if(edit.typ==='arbeit'){
        if((!edit.von||!edit.bis) && edit.std==null) return toast('Von/Bis oder Stunden eintragen');
        if(edit.von&&edit.bis) Object.assign(e,{von:edit.von,bis:edit.bis,pause:edit.pause});
        if(edit.zuschlag) e.zuschlag=edit.zuschlag; }
      if(edit.std!=null && edit.typ!=='frei') e.std=edit.std;
      if(edit.notiz) e.notiz=edit.notiz;
      const ch=setDay(s,e); save(); closeSheet(); if(ch) commitKal([s]); render(); toast('Gespeichert');
      return;
    }
  }
});

/* ---------- Start ---------- */
load();
try{ const c=JSON.parse(localStorage.getItem(WKEY)||'null'); if(c && applyWerte(c)) save(); }catch(e){}
render();
/* Erinnerungen: beim Öffnen und wenn die App wieder in den Vordergrund kommt */
const pop=document.getElementById('pop');
pop.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-pop]'); if(!b||!popItem) return;
  const it=popItem;
  if(b.dataset.pop==='copy'){ copyText(wertePrompt()); return; }
  if(b.dataset.pop==='later'){ snooze(it.id,7); toast('Erinnere dich in 7 Tagen'); }
  if(b.dataset.pop==='backup'){ S.lastBackup=Date.now(); save(); download(`zeiterfassung-backup-${iso(new Date())}.json`,JSON.stringify({app:'zeiterfassung',version:APP_VERSION,...S},null,1),'application/json'); }
  if(b.dataset.pop==='close' && !it.manuell && !it.info && !(S.erinn[it.id]||{}).done) snooze(it.id,1);
  closePop(); if(tab==='rente'||tab==='einst') render();
});
pop.addEventListener('change',ev=>{
  if(ev.target.id!=='popDone'||!popItem) return;
  setErledigt(popItem.id, ev.target.checked);
  if(ev.target.checked){ toast('Erledigt ✓'); setTimeout(()=>{ closePop(); if(tab==='rente') render(); },450); }
});
document.getElementById('popBg').addEventListener('click',()=>{ if(popItem && !popItem.manuell && !popItem.info) snooze(popItem.id,1); closePop(); });
ladeWerte();
setTimeout(checkPop,800);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') setTimeout(checkPop,600); });
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
